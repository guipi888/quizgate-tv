name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 仓库不提交 gradle-wrapper.jar（二进制不入库），
      # 构建前用 runner 预装的 gradle 生成 wrapper。
      # --no-validate-url：Gradle 8.10+ 默认对 distribution URL 发 HEAD 探测，
      # GitHub runner 到 services.gradle.org 的 HEAD 连通性不可靠（十四跑
      # API 30 连续两次挂在此处）；发行包 GET 下载不受影响，探测只是额外校验。
      # 重试 3 次防其他偶发。
      - name: Generate Gradle Wrapper
        run: |
          for i in 1 2 3; do
            if gradle wrapper --gradle-version 8.7 --no-validate-url; then exit 0; fi
            echo "::warning::wrapper 生成失败（第 $i 次），10 秒后重试"
            sleep 10
          done
          echo "::error::wrapper 生成三次均失败"
          exit 1

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quizgate-tv-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    needs: build
    # 注意：表达式内含引号时，整个 if 值必须加双引号、内部用单引号，
    # 否则 GitHub 表达式解析器报 Unexpected symbol（工作流直接 0 job 失败）
    if: "startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 同 build job：--no-validate-url 绕开 runner 上不可靠的 HEAD 探测 + 重试
      - name: Generate Gradle Wrapper
        run: |
          for i in 1 2 3; do
            if gradle wrapper --gradle-version 8.7 --no-validate-url; then exit 0; fi
            echo "::warning::wrapper 生成失败（第 $i 次），10 秒后重试"
            sleep 10
          done
          echo "::error::wrapper 生成三次均失败"
          exit 1

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: quizgate-tv-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
