name: TV Test

# 在真实 Android TV 系统镜像上跑单元测试 + Espresso 仪器测试，
# 覆盖本地无电视硬件时无法验证的 P0 项（前台服务、通知、悬浮窗拉起、
# 倒计时到期、重启恢复、TV 桌面可见性、U 盘题库导入）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tv-test:
    name: Android TV · API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    strategy:
      # 两个系统版本都跑完，结果互不影响
      fail-fast: false
      matrix:
        include:
          # Android 11：现代电视盒子基线系统。U 盘题库导入只在 API<=32 验证
          # （READ_EXTERNAL_STORAGE 声明了 maxSdkVersion=32，33+ 需 SAF/所有文件访问）
          # 注意：android-tv 的 x86_64 镜像从 API 36 才开始提供，30/34 用 32 位 x86
          - api-level: "30"
            arch: x86
          # Android 14：最新电视系统。验证前台服务类型、通知权限、重启恢复等新版本行为
          - api-level: "34"
            arch: x86
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 仓库不提交 gradle-wrapper.jar（二进制不入库），
      # 构建前用 runner 预装的 gradle 生成 wrapper（与 build.yml 一致）。
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: android-tv
          arch: ${{ matrix.arch }}
          profile: tv_1080p
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none
          disable-animations: true
          script: |
            set -e
            set -o pipefail
            PKG=com.quizgate.tv

            echo "== 安装 App 与仪器测试 APK =="
            ./gradlew installDebug installDebugAndroidTest --no-daemon

            echo "== 授予仪器测试依赖的权限 =="
            # 悬浮窗：Android 10+ 后台拉起锁屏页 / 开机恢复必需（appops 方式，重装保持）
            adb shell appops set $PKG SYSTEM_ALERT_WINDOW allow || true
            # 通知：前台服务常驻倒计时通知（API 33+ 运行时权限）
            adb shell pm grant $PKG android.permission.POST_NOTIFICATIONS || true
            # 存储：U 盘题库导入（仅 API<=32 有效）
            adb shell pm grant $PKG android.permission.READ_EXTERNAL_STORAGE || true

            echo "== P0 ⑥ 准备 U 盘题库样本（模拟插入 U 盘）=="
            adb shell mkdir -p /sdcard/QuizGate/banks
            adb push app/src/androidTest/assets/usb_bank_sample.json /sdcard/QuizGate/banks/usb_bank_sample.json

            echo "== P0 ① TV 桌面可见性（LEANBACK_LAUNCHER）=="
            if ! adb shell dumpsys package $PKG | grep -q "android.intent.category.LEANBACK_LAUNCHER"; then
              echo "::error::App 未在 TV 桌面（LEANBACK_LAUNCHER）可见"
              exit 1
            fi

            FAIL=0
            echo "== 单元测试 + 仪器测试 =="
            if ./gradlew testDebugUnitTest connectedCheck --no-daemon; then
              echo "测试全部通过"
            else
              echo "::error::测试存在失败"
              FAIL=1
            fi

            echo "== P0 ⑧ 重启恢复（真实 adb reboot + BOOT_COMPLETED）=="
            # 用 run-as（debug 包免 root）直接写入「计时中」状态，绕开 UI 操作
            END=$(( $(date +%s) * 1000 + 1800000 ))
            sed "s/__LOCK_END_AT__/$END/" app/src/androidTest/assets/prefs_timer_running.xml \
              | adb shell run-as $PKG sh -c 'cat > shared_prefs/quizgate_prefs.xml'
            # 清掉 stopped 标志，确保开机广播能送达本应用
            adb shell am start -n $PKG/.MainActivity
            sleep 5
            adb reboot
            adb wait-for-device
            for i in $(seq 1 60); do
              if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then
                break
              fi
              sleep 2
            done
            # BootReceiver 收到 BOOT_COMPLETED 后应重新拉起 LockService
            FOUND=0
            for i in $(seq 1 30); do
              if adb shell dumpsys activity services $PKG | grep -q LockService; then
                FOUND=1
                break
              fi
              sleep 2
            done
            if [ "$FOUND" = "1" ]; then
              echo "重启后计时服务已恢复"
            else
              echo "::error::重启后 LockService 未恢复"
              FAIL=1
            fi

            if [ "$FAIL" != "0" ]; then
              adb exec-out screencap -p > tv-failure.png || true
              exit 1
            fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-test-report-api${{ matrix.api-level }}
          if-no-files-found: ignore
          path: |
            app/build/reports/androidTests/
            app/build/reports/tests/
            app/build/outputs/androidTest-results/
            tv-failure.png
