name: TV Test

# 在真实 Android TV 系统镜像上跑单元测试 + Espresso 仪器测试，
# 覆盖本地无电视硬件时无法验证的 P0 项（前台服务、通知、悬浮窗拉起、
# 倒计时到期、重启恢复、TV 桌面可见性、U 盘题库导入）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tv-test:
    name: Android TV · API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    strategy:
      # 三个系统版本都跑完，结果互不影响（fail-fast: false）
      fail-fast: false
      matrix:
        include:
          # Android 9：产品声称支持 U 盘导入的最低系统（README 已知限制）。
          # 该版本无分区存储，配合 tv-e2e.sh 的 pm grant READ_EXTERNAL_STORAGE
          # （manifest maxSdkVersion=32 覆盖），/sdcard/QuizGate 样本真实可读，
          # UsbBankImportTest 走「可读」正向分支——canonical 去重、恰好入库一次、
          # 计入总量在真实文件上得到验证（API 29+ 只有 JVM 单测 BankLoaderTest 守护）。
          # 没有这个 job，「支持到 Android 9」就只是一句无测试背书的声明。
          - api-level: "28"
            arch: x86
          # Android 11：现代电视盒子基线系统。
          # U 盘题库导入说明（2026-11-05 CI 实测）：targetSdk 33 在 API 29+
          # 设备上受分区存储约束，File 路径读 /sdcard/QuizGate 不可用
          # （requestLegacyExternalStorage 只对 targetSdk 29 有效），
          # 因此 UsbBankImportTest 按「可读则正向断言 / 不可读则优雅降级」
          # 分支配断，canonical 去重回归由 JVM 单元测试 BankLoaderTest 守护；
          # 恢复导入需 SAF 或 MANAGE_EXTERNAL_STORAGE，见 README 已知限制。
          # 注意：android-tv 的 x86_64 镜像从 API 36 才开始提供，30/34 用 32 位 x86
          - api-level: "30"
            arch: x86
          # Android 14：最新电视系统。验证前台服务类型、通知权限、重启恢复等新版本行为
          - api-level: "34"
            arch: x86
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 仓库不提交 gradle-wrapper.jar（二进制不入库），
      # 构建前用 runner 预装的 gradle 生成 wrapper（与 build.yml 一致）。
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: android-tv
          arch: ${{ matrix.arch }}
          profile: tv_1080p
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none
          disable-animations: true
          # 注意：android-emulator-runner 会把 script 输入按行拆开、每行单独
          # sh -c 执行（变量不跨行、多行 if/for 会语法错误），
          # 所以这里只写一行，全部逻辑放在 .github/scripts/tv-e2e.sh
          script: bash .github/scripts/tv-e2e.sh

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-test-report-api${{ matrix.api-level }}
          if-no-files-found: ignore
          path: |
            app/build/reports/androidTests/
            app/build/reports/tests/
            app/build/outputs/androidTest-results/
            tv-failure.png
